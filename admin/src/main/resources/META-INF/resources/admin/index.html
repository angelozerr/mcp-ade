<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Language Tools - Admin</title>
    <link rel="stylesheet" href="css/theme-dark.css">
    <link rel="stylesheet" href="css/theme-light.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/diagram.css">
    <script>
        (function() {
            var DARK = 'dark', LIGHT = 'light', KEY = 'admin-theme';
            var saved = localStorage.getItem(KEY);
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else {
                // No local cache: apply OS preference immediately, then sync from server
                var os = window.matchMedia('(prefers-color-scheme: light)').matches ? LIGHT : DARK;
                document.documentElement.setAttribute('data-theme', os);
                fetch('/api/admin/settings/admin.theme')
                    .then(function(r) { return r.ok ? r.json() : null; })
                    .then(function(data) {
                        if (data && data.value) {
                            document.documentElement.setAttribute('data-theme', data.value);
                            localStorage.setItem(KEY, data.value);
                            if (window.updateThemeIcon) window.updateThemeIcon(data.value);
                        }
                    })
                    .catch(function() {});
            }
        })();
    </script>
    <!-- vis.js for network diagrams (local copy for offline support) -->
    <script type="text/javascript" src="js/vis-network.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Left: Workspaces or All Servers -->
        <div class="workspaces-sidebar">
            <div class="sidebar-header">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('workspaces', this)">Workspaces</div>
                    <div class="tab" onclick="switchTab('lsp-servers', this)">Servers</div>
                    <div class="tab" onclick="switchTab('dap-servers', this)">Debuggers</div>
                    <div class="tab" onclick="switchTab('extensions', this)">Extensions</div>
                    <div class="tab" onclick="switchTab('mcp-traces', this)">MCP</div>
                    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-toggle-btn" title="Toggle light/dark theme">🌙</button>
                </div>
            </div>
            <div id="workspaces-list"></div>
            <div id="lsp-servers-list" style="display: none;"></div>
            <div id="dap-servers-list" style="display: none;"></div>
            <div id="extensions-container" style="display: none;">
                <div class="add-extension-bar">
                    <button onclick="showAddExtensionForm()">+ Add Extension</button>
                </div>
                <div id="extensions-list"></div>
            </div>
            <div id="mcp-traces-list" style="display: none;">
                <div style="padding: 1rem; border-bottom: 1px solid var(--border-primary);">
                    <h3 class="text-primary" style="margin-bottom: 0.25rem;">AI Clients</h3>
                    <p class="text-dimmed" style="font-size: 0.75rem;">Connected via MCP</p>
                </div>
                <div id="mcp-clients-list"></div>
            </div>
        </div>

        <!-- Middle: LSP Servers -->
        <div class="servers-sidebar">
            <div id="servers-list"></div>
        </div>

        <!-- Right: Console -->
        <div class="console-container" id="console-container">
            <div class="search-box" id="search-box">
                <input type="text" id="search-input" placeholder="Find in console..." />
                <span class="search-count" id="search-count">0/0</span>
                <button onclick="searchPrev()">&#8593;</button>
                <button onclick="searchNext()">&#8595;</button>
                <span class="search-close" onclick="closeSearch()">&#215;</span>
            </div>
            <div id="console-area">
                <div class="placeholder">
                    &#8592; Select a workspace and LSP server to view console
                </div>
            </div>
        </div>
    </div>

    <!-- Generic Modal (for confirmAction, showAlert) -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-message" id="modal-message"></div>
            <div class="modal-buttons" id="modal-buttons"></div>
        </div>
    </div>

    <!-- Confirmation Modal (for closeWorkspace) -->
    <div id="confirm-modal" class="modal-overlay" onclick="if(event.target === this) hideConfirmModal()">
        <div class="modal">
            <div class="modal-title" id="confirm-modal-title">Confirm Action</div>
            <div class="modal-message" id="confirm-modal-message"></div>
            <div class="modal-buttons">
                <button class="modal-button modal-button-cancel" onclick="hideConfirmModal()">Cancel</button>
                <button class="modal-button modal-button-confirm" id="modal-confirm-btn">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Global Progress Footer -->
    <div id="progress-footer" class="progress-footer">
        <div class="progress-footer-content">
            <span id="progress-status" class="progress-status">No tasks running</span>
            <button id="progress-toggle" class="progress-toggle" onclick="toggleProgressPanel()" title="Show progress tasks">
                <span id="progress-icon">&#9208;</span>
                <span id="progress-count" class="progress-count">0</span>
            </button>
        </div>
    </div>

    <!-- Progress Panel (slide up from footer) -->
    <div id="progress-panel" class="progress-panel">
        <div class="progress-panel-header">
            <h3>Active Tasks</h3>
            <button onclick="toggleProgressPanel()">&#10005;</button>
        </div>
        <div id="progress-panel-content" class="progress-panel-content">
            <div class="text-secondary" style="text-align: center; padding: 2rem;">No active tasks</div>
        </div>
    </div>

    <script src="js/diagram.js"></script>
    <script src="js/error-formatter.js"></script>
    <script src="js/trace-renderer.js"></script>
    <script src="js/keyboard-shortcuts.js"></script>
    <script src="js/progress-renderer.js"></script>
    <script src="js/progress-manager.js"></script>
    <script src="js/admin-workspace.js"></script>
    <script src="js/language-filter.js"></script>
    <script src="js/admin-lsp.js"></script>
    <script src="js/admin-dap.js"></script>
    <script src="js/admin-extensions.js"></script>
    <script src="js/admin-mcp.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
