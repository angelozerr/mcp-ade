<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP ADE (Agent Development Environment) - Admin</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/theme-dark.css">
    <link rel="stylesheet" href="css/theme-light.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/admin-mcp.css">
    <link rel="stylesheet" href="css/admin-settings.css">
    <link rel="stylesheet" href="css/diagram.css">
    <script>
        (function() {
            var DARK = 'dark', LIGHT = 'light', KEY = 'admin-theme';
            var saved = localStorage.getItem(KEY);
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else {
                var os = window.matchMedia('(prefers-color-scheme: light)').matches ? LIGHT : DARK;
                document.documentElement.setAttribute('data-theme', os);
                fetch('/api/admin/settings/admin.theme')
                    .then(function(r) { return r.ok ? r.json() : null; })
                    .then(function(data) {
                        if (data && data.value) {
                            document.documentElement.setAttribute('data-theme', data.value);
                            localStorage.setItem(KEY, data.value);
                        }
                    })
                    .catch(function() {});
            }
        })();
    </script>
    <!-- vis.js for network diagrams (local copy for offline support) -->
    <script defer src="js/vis-network.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Top: Full-width tab bar -->
        <div class="top-tabs-bar">
            <div class="tabs">
                <div class="tab active" data-action="switchTab" data-tab="workspaces">Workspaces</div>
                <div class="tab" data-action="switchTab" data-tab="lsp-servers">Servers</div>
                <div class="tab" data-action="switchTab" data-tab="dap-servers">Debuggers</div>
                <div class="tab" data-action="switchTab" data-tab="bsp-servers">Build</div>
                <div class="tab" data-action="switchTab" data-tab="runtimes">Runtimes</div>
                <div class="tab" data-action="switchTab" data-tab="languages">Languages</div>
                <div class="tab" data-action="switchTab" data-tab="extensions">Extensions</div>
                <div class="tab" data-action="switchTab" data-tab="mcp-traces">MCP</div>
                <button class="theme-toggle-btn" data-action="toggleTheme" id="theme-toggle-btn" title="Toggle light/dark theme">🌙</button>
            </div>
        </div>

        <!-- Content area: columns depend on active tab -->
        <div class="content-area">
            <!-- Left: Workspaces or All Servers -->
            <div class="workspaces-sidebar">
                <div id="workspaces-list"></div>
                <div id="lsp-servers-list" class="d-none"></div>
                <div id="dap-servers-list" class="d-none"></div>
                <div id="bsp-servers-list" class="d-none"></div>
                <div id="runtimes-container" class="d-none">
                    <div class="runtime-subtabs">
                        <div class="runtime-subtab active" data-action="switchRuntimeSubtab" data-subtab="list">Runtimes</div>
                        <div class="runtime-subtab" data-action="switchRuntimeSubtab" data-subtab="path">PATH</div>
                        <div class="runtime-subtab" data-action="switchRuntimeSubtab" data-subtab="environment">Environment</div>
                        <div class="runtime-subtab" data-action="switchRuntimeSubtab" data-subtab="terminal">Terminal</div>
                    </div>
                    <div id="runtimes-list"></div>
                </div>
                <div id="languages-list" class="d-none"></div>
                <div id="extensions-container" class="d-none">
                    <div class="add-extension-bar">
                        <button data-action="showAddExtensionForm">+ Add Extension</button>
                    </div>
                    <div id="extensions-list"></div>
                </div>
                <div id="mcp-traces-list" class="d-none">
                    <div class="mcp-clients-header">
                        <h3 class="text-primary mcp-clients-title">AI Agents</h3>
                        <p class="text-dimmed mcp-clients-subtitle">Connected via MCP</p>
                    </div>
                    <div id="mcp-clients-list"></div>
                </div>
            </div>

            <!-- Middle: LSP Servers -->
            <div class="servers-sidebar">
                <div id="servers-list"></div>
            </div>

            <!-- Right: Console -->
            <div class="console-container" id="console-container">
                <div class="search-box" id="search-box">
                    <input type="text" id="search-input" placeholder="Find in console..." />
                    <span class="search-count" id="search-count">0/0</span>
                    <button data-action="searchPrev">&#8593;</button>
                    <button data-action="searchNext">&#8595;</button>
                    <span class="search-close" data-action="closeSearch">&#215;</span>
                </div>
                <div id="console-area">
                    <div class="placeholder">
                        &#8592; Select a workspace and LSP server to view console
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Generic Modal (for confirmAction, showAlert) -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-message" id="modal-message"></div>
            <div class="modal-buttons" id="modal-buttons"></div>
        </div>
    </div>

    <!-- Confirmation Modal (for closeWorkspace) -->
    <div id="confirm-modal" class="modal-overlay" data-action="hideConfirmModalOverlay">
        <div class="modal">
            <div class="modal-title" id="confirm-modal-title">Confirm Action</div>
            <div class="modal-message" id="confirm-modal-message"></div>
            <div class="modal-buttons">
                <button class="modal-button modal-button-cancel" data-action="hideConfirmModal">Cancel</button>
                <button class="modal-button modal-button-confirm" id="modal-confirm-btn">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Global Progress Footer -->
    <div id="progress-footer" class="progress-footer">
        <div class="progress-footer-content">
            <span id="progress-status" class="progress-status">No tasks running</span>
            <button id="progress-toggle" class="progress-toggle" data-action="toggleProgressPanel" title="Show progress tasks">
                <span id="progress-icon">&#9208;</span>
                <span id="progress-count" class="progress-count">0</span>
            </button>
        </div>
    </div>

    <!-- Progress Panel (slide up from footer) -->
    <div id="progress-panel" class="progress-panel">
        <div class="progress-panel-header">
            <h3>Active Tasks</h3>
            <button data-action="toggleProgressPanel">&#10005;</button>
        </div>
        <div id="progress-panel-content" class="progress-panel-content">
            <div class="text-secondary text-center p-xl">No active tasks</div>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
